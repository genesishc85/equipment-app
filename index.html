<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>벨포레리조트NMS - 장비관리</title>

<meta name="theme-color" content="#0f1115">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {

  });

<style>
  :root{
    --bg:#1a1d24; --card:#20242c; --card2:#242832; --border:#2c313c; --border-strong:#374151;
    --text:#e6e6e6; --text2:#9aa0a8; --muted:#6b7280;
    --accent:#3b82f6; --accent-hover:#2563eb; --accent-title:#93c5fd;
    --danger:#dc2626; --danger-hover:#b91c1c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px;}

  .site-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .site-title{font-size:16px;font-weight:700;color:var(--accent-title);}
  .site-sub{font-size:12px;color:var(--text2);margin-top:2px;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:10;}
  .tab{flex:1;text-align:center;padding:10px 4px;border-radius:8px;border:1px solid var(--border);
    background:var(--card2);font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;}
  .tab.active{background:rgba(59,130,246,0.15);color:var(--accent-title);border-color:var(--accent);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}

  label{display:block;font-size:12px;color:var(--text2);margin:12px 0 4px;font-weight:500;}
  label:first-child{margin-top:0;}
  input,select,textarea{
    width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--border-strong);
    border-radius:8px;background:var(--card2);color:var(--text);font-family:inherit;
  }
  input::placeholder,textarea::placeholder{color:var(--muted);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:56px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 16px;border-radius:8px;border:none;
    background:var(--card2);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;
  }
  .btn:hover{color:var(--text);background:#2c313c;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:16px;padding:13px;font-size:15px;}
  .btn-primary:hover{background:var(--accent-hover);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:var(--danger-hover);color:#fff;}
  .btn-sm{padding:6px 10px;font-size:13px;}

  .err{color:#f87171;font-size:12px;margin-top:4px;display:none;}

  .search{margin-bottom:12px;}

  .filter-block{margin-bottom:10px;}
  .filter-cat{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;
    background:var(--card2);border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--text2);}
  .filter-cat.open{border-color:var(--accent);}
  .filter-cat .cat-label{font-weight:500;color:var(--text);}
  .filter-cat .cat-caret{margin-left:auto;color:var(--text2);font-size:11px;}
  .filter-cat .cat-selected{color:var(--accent-title);font-size:12.5px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:var(--card2);
    color:var(--text2);font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .chip.active{background:rgba(59,130,246,0.18);color:var(--accent-title);border-color:var(--accent);}

  .action-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
  .stat .n{font-size:20px;font-weight:600;color:var(--text);}
  .stat .l{font-size:11px;color:var(--text2);margin-top:2px;}

  .venue-group{margin-bottom:16px;}
  .venue-title{font-size:14px;font-weight:600;color:var(--text2);margin:0 0 8px;padding-left:2px;}
  .item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .item-name{font-size:15px;font-weight:500;color:var(--text);}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--card2);color:var(--text2);margin-left:6px;vertical-align:middle;}
  .badge.type{background:rgba(59,130,246,0.15);color:var(--accent-title);}
  .item-loc{font-size:13px;color:var(--text2);margin-top:2px;}
  .item-meta{font-size:12.5px;color:var(--text2);margin-top:6px;line-height:1.6;}
  .item-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text2);}
  .icon-btn:hover{color:var(--text);}

  .photo-thumb-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .photo-thumb-row img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--card2);}

  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    opacity:0;visibility:hidden;transition:opacity .22s ease;}
  .lightbox-overlay.show{opacity:1;visibility:visible;}
  .lightbox-img{max-width:90vw;max-height:75vh;border-radius:10px;object-fit:contain;
    transform:scale(0.96);opacity:0;transition:opacity .22s ease,transform .22s ease;}
  .lightbox-overlay.show .lightbox-img{transform:scale(1);opacity:1;}
  .lightbox-bar{display:flex;align-items:center;gap:20px;margin-top:16px;}
  .lightbox-nav{width:42px;height:42px;border-radius:50%;background:var(--card2);border:1px solid var(--border-strong);
    color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-count{color:var(--text2);font-size:13px;min-width:50px;text-align:center;}
  .lightbox-close{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;
    background:var(--card2);border:1px solid var(--border-strong);color:var(--text);font-size:18px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}

  .photo-input-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .photo-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-strip .ph-wrap{position:relative;width:64px;height:64px;}
  .photo-strip img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .photo-strip .ph-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;}
  .empty .big{font-size:32px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--border-strong);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;
  }
  .toast.show{opacity:1;}

  .datalist-wrap{position:relative;}

  @keyframes listIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .item, .venue-title{ animation:listIn 0.32s ease both; }
  @media (prefers-reduced-motion: reduce){ .item, .venue-title{ animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="site-bar">
    <div>
      <div class="site-title">벨포레리조트NMS</div>
      <div class="site-sub">장비관리</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="add">등록</div>
    <div class="tab" data-tab="list">목록</div>
  </div>

  <div id="tab-add">
    <div class="card">
      <label>업장 *</label>
      <div class="datalist-wrap">
        <input id="f-venue" list="venue-list" placeholder="예: 블랙스톤 클럽하우스" autocomplete="off">
        <datalist id="venue-list"></datalist>
      </div>
      <div class="err" id="err-venue">업장을 입력하세요</div>

      <label>부서/팀</label>
      <div class="datalist-wrap">
        <input id="f-team" list="team-list" placeholder="예: 그린팀, F&B팀 (없으면 비워둠)" autocomplete="off">

      </div>

      <label>세부 위치 *</label>
      <input id="f-location" placeholder="예: 서버실, 2층 라운지 랙">

      <label>장비 유형</label>
      <select id="f-type">

        <option value="노트북">노트북</option>
        <option value="모니터">모니터</option>
        <option value="백본망 장비">백본망 장비</option>
        <option value="L2스위치">L2스위치</option>
        <option value="L3스위치">L3스위치</option>
        <option value="POS">POS</option>
        <option value="키오스크">키오스크</option>
        <option value="카드결제단말기">카드결제단말기</option>
        <option value="CCTV">CCTV</option>
        <option value="인터넷전화기">인터넷전화기</option>
        <option value="허브">허브</option>
        <option value="공유기">공유기</option>
        <option value="기타">기타</option>
      </select>

      <div id="mode-wrap" style="display:none;">
        <label>동작모드</label>
        <select id="f-mode">
          <option value="공유기모드">공유기모드</option>

      </div>

      <label>장비명 *</label>
      <input id="f-name" placeholder="예: Aruba 6200F-24G">
      <div class="err" id="err-name">장비명을 입력하세요</div>

      <label>네임태그</label>

        <div>

            <option value="DHCP">DHCP</option>

      <label>MAC 주소</label>

      <label>사진 (여러 장 추가 가능)</label>

        <input type="file" id="f-photo" accept="image/*" style="flex:1;">
      </div>
      <div class="photo-strip" id="photo-strip"></div>

      <label>메모</label>
      <textarea id="f-note" placeholder="비고, 특이사항 등"></textarea>

      <label>연결된 스위치 위치</label>

      <button class="btn btn-primary" id="save-btn">저장</button>
    </div>
  </div>

  <div id="tab-list" style="display:none;">
    <input class="search" id="search" placeholder="예: lg 미디어 (띄어쓰기로 여러 단어 동시검색)">

    <div class="filter-block">
      <div class="filter-cat" id="venue-cat" onclick="toggleSection('venue')">
        <span class="cat-label">업장</span>
        <span class="cat-selected" id="venue-selected"></span>
        <span class="cat-caret" id="venue-caret">▾</span>
      </div>

        <span class="cat-selected" id="team-selected"></span>

    </div>

<div class="toast" id="toast"></div>

<div class="lightbox-overlay" id="lightbox">
  <div class="lightbox-close" onclick="closeLightbox()">×</div>
  <img class="lightbox-img" id="lightbox-img" src="">

    <div class="lightbox-nav" id="lightbox-prev" onclick="lightboxPrev()">‹</div>
    <div class="lightbox-count" id="lightbox-count"></div>
    <div class="lightbox-nav" id="lightbox-next" onclick="lightboxNext()">›</div>
  </div>
</div>

<script>
// 클로드 아티팩트 밖(일반 브라우저)에서 실행될 때를 위한 window.storage 폴리필
// (클로드 미리보기 안에서는 네이티브 window.storage가 있으면 그걸 그대로 사용)
if (!window.storage) {
  window.storage = {
    async get(key, shared){
      const v = localStorage.getItem(key);
      if (v === null) throw new Error('key not found: ' + key);
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = [];
      const p = prefix || '';
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k.indexOf(p) === 0) keys.push(k);
      }
      return { keys, prefix: p, shared: !!shared };
    }
  };
}
const SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxMse47GYE1N_AIxj8bdo9Mz3ALOn1vQs3MX2YRpBQwBnkOZz-gelhw7KpP-6xe-4u6rg/exec';

async function sendToSheet(item, photos, source, id){
  try{
    const payload = {
      id: id,
      출처: source,
      업장: item.venue || '',
      부서팀: item.team || '',
      위치: item.location || '',
      장비유형: item.type || '',
      장비명: item.name || '',
      네임태그: item.tag || '',
      모델명: item.model || '',
      MAC주소: item.mac || '',
      IP구분: item.iptype || '',
      IP주소: item.ip || '',
      시리얼번호: item.serial || '',
      동작모드: item.mode || '',
      연결된스위치위치: item.uplink || '',
      메모: item.note || '',
      photos: photos || []
    };
    await fetch(SHEET_WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
  }catch(e){
    console.error('시트 전송 실패', e);
  }
}

const STORE_KEY = 'equipment_list';
let items = [];
let editingId = null;
let pendingPhotos = [];      // 새로 추가되는 사진 (dataURL 배열)
let existingPhotoKeys = [];  // 수정 중인 항목이 이미 갖고 있는 사진 키
let removedPhotoKeys = [];   // 수정 중 삭제 표시된 기존 사진 키
let filterVenues = [];
let filterTeams = [];
let filterTypes = [];
let expandedSection = null;
const photoCache = {};       // 목록 렌더링용 캐시: itemId -> [dataUrl, ...]

async function loadItems(){
  try{
    const res = await window.storage.get(STORE_KEY);
    items = res ? JSON.parse(res.value) : [];
  }catch(e){
    items = [];
  }
}
async function saveItems(){
  await window.storage.set(STORE_KEY, JSON.stringify(items));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.getElementById('tab-add').style.display = name==='add' ? '' : 'none';
  document.getElementById('tab-list').style.display = name==='list' ? '' : 'none';
  if(name==='list') renderList();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>switchTab(t.dataset.tab));
});

function updateModeVisibility(){
  const t = document.getElementById('f-type').value;
  document.getElementById('mode-wrap').style.display = (t==='공유기') ? '' : 'none';
}
document.getElementById('f-type').addEventListener('change', updateModeVisibility);

function updateIpLabel(){
  const t = document.getElementById('f-iptype').value;
  const label = document.getElementById('f-ip-label');
  const input = document.getElementById('f-ip');
  label.textContent = 'IP 주소';
  input.placeholder = t==='DHCP' ? '예: 192.168.10.100 (DHCP 할당)' : '예: 192.168.10.11';
}
document.getElementById('f-iptype').addEventListener('change', updateIpLabel);

function compressImage(file, maxDim=900, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w); w=maxDim;} }
        else{ if(h>maxDim){w=Math.round(w*maxDim/h); h=maxDim;} }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('이미지를 불러올 수 없습니다'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('파일을 읽을 수 없습니다'));
    reader.readAsDataURL(file);
  });
}


function renderPhotoStrip(){
  const strip = document.getElementById('photo-strip');
  let html = '';
  existingPhotoKeys.forEach(key=>{
    if(removedPhotoKeys.includes(key)) return;
    html += `<div class="ph-wrap"><img src="${photoCache['__form__'+key]||''}" data-key="${key}"><div class="ph-remove" onclick="removeExistingPhoto('${key}')">×</div></div>`;
  });
  pendingPhotos.forEach((dataUrl, idx)=>{
    html += `<div class="ph-wrap"><img src="${dataUrl}"><div class="ph-remove" onclick="removePendingPhoto(${idx})">×</div></div>`;
  });
  strip.innerHTML = html;
}

function removeExistingPhoto(key){
  removedPhotoKeys.push(key);
  renderPhotoStrip();
}
function removePendingPhoto(idx){
  pendingPhotos.splice(idx,1);
  renderPhotoStrip();
}

document.getElementById('f-photo').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file);
    pendingPhotos.push(dataUrl);
    renderPhotoStrip();
  }catch(err){
    showToast('사진 처리 실패');
  }
  e.target.value = '';
});

function clearForm(){
  ['f-venue','f-team','f-location','f-name','f-tag','f-model','f-ip','f-mac','f-serial','f-uplink','f-note'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  document.getElementById('f-type').value = '사무용PC';
  document.getElementById('f-mode').value = '공유기모드';
  document.getElementById('f-iptype').value = '고정IP';
  updateIpLabel();
  updateModeVisibility();
  editingId = null;
  pendingPhotos = [];
  existingPhotoKeys = [];
  removedPhotoKeys = [];
  document.getElementById('f-photo').value = '';
  renderPhotoStrip();
  document.getElementById('save-btn').textContent = '저장';
  ['err-venue','err-location','err-name'].forEach(id=>document.getElementById(id).style.display='none');
}

function updateVenueList(){
  const vdl = document.getElementById('venue-list');
  const venues = [...new Set(items.map(i=>i.venue))];
  vdl.innerHTML = venues.map(v=>`<option value="${escapeHtml(v)}">`).join('');
  const tdl = document.getElementById('team-list');
  const teams = [...new Set(items.map(i=>i.team).filter(Boolean))];
  tdl.innerHTML = teams.map(v=>`<option value="${escapeHtml(v)}">`).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

async function handleSave(){
  const venue = document.getElementById('f-venue').value.trim();
  const team = document.getElementById('f-team').value.trim();
  const location = document.getElementById('f-location').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const tag = document.getElementById('f-tag').value.trim();
  const type = document.getElementById('f-type').value;
  const mode = (type==='공유기') ? document.getElementById('f-mode').value : '';
  const model = document.getElementById('f-model').value.trim();
  const iptype = document.getElementById('f-iptype').value;
  const ip = document.getElementById('f-ip').value.trim();
  const mac = document.getElementById('f-mac').value.trim();
  const serial = document.getElementById('f-serial').value.trim();
  const uplink = document.getElementById('f-uplink').value.trim();
  const note = document.getElementById('f-note').value.trim();

  let ok = true;
  document.getElementById('err-venue').style.display = venue ? 'none' : 'block';
  document.getElementById('err-location').style.display = location ? 'none' : 'block';
  document.getElementById('err-name').style.display = name ? 'none' : 'block';
  if(!venue || !location || !name) ok = false;
  if(!ok) return;

  const targetId = editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,6));

  // 사진 처리: 삭제 표시된 기존 사진 지우고, 새로 추가된 사진 저장
  let finalPhotoKeys = existingPhotoKeys.filter(k=>!removedPhotoKeys.includes(k));
  for(const key of removedPhotoKeys){
    try{ await window.storage.delete(key, false); }catch(e){}
  }
  for(let i=0;i<pendingPhotos.length;i++){
    const key = 'photo:'+targetId+':'+Date.now().toString(36)+i;
    try{
      await window.storage.set(key, pendingPhotos[i], false);
      finalPhotoKeys.push(key);
    }catch(e){
      showToast('사진 일부 저장 실패');
    }
  }

  if(editingId){
    const idx = items.findIndex(i=>i.id===editingId);
    if(idx>-1){
      items[idx] = {...items[idx], venue, team, location, type, mode, name, tag, model, iptype, ip, mac, serial, uplink, note, photoKeys:finalPhotoKeys};
    }
  }else{
    items.push({
      id: targetId,
      venue, team, location, type, mode, name, tag, model, iptype, ip, mac, serial, uplink, note, photoKeys:finalPhotoKeys,
      createdAt: new Date().toISOString()
    });
  }

  const isNew = !editingId;
  const newItemForSheet = {venue, team, location, type, mode, name, tag, model, iptype, ip, mac, serial, uplink, note};
  const keptExistingBase64 = existingPhotoKeys
    .filter(k => !removedPhotoKeys.includes(k))
    .map(k => photoCache['__form__'+k])
    .filter(Boolean);
  const photosForSheet = [...keptExistingBase64, ...pendingPhotos];

  try{
    await saveItems();
    showToast(editingId ? '수정되었습니다' : '등록되었습니다');
    clearForm();
    updateVenueList();
    sendToSheet(newItemForSheet, photosForSheet, isNew ? '폰등록' : '폰수정');
  }catch(e){
    showToast('저장 실패, 다시 시도해주세요');
  }
}
document.getElementById('save-btn').addEventListener('click', handleSave);

async function startEdit(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  document.getElementById('f-venue').value = item.venue;
  document.getElementById('f-team').value = item.team || '';
  document.getElementById('f-location').value = item.location;
  document.getElementById('f-type').value = item.type;
  updateModeVisibility();
  if(item.mode) document.getElementById('f-mode').value = item.mode;
  document.getElementById('f-name').value = item.name;
  document.getElementById('f-tag').value = item.tag || '';
  document.getElementById('f-model').value = item.model || '';
  document.getElementById('f-iptype').value = item.iptype || '고정IP';
  updateIpLabel();
  document.getElementById('f-ip').value = item.ip || '';
  document.getElementById('f-mac').value = item.mac || '';
  document.getElementById('f-serial').value = item.serial || '';
  document.getElementById('f-uplink').value = item.uplink || '';
  document.getElementById('f-note').value = item.note || '';
  editingId = id;
  pendingPhotos = [];
  removedPhotoKeys = [];
  existingPhotoKeys = item.photoKeys ? [...item.photoKeys] : [];
  document.getElementById('f-photo').value = '';
  renderPhotoStrip();
  for(const key of existingPhotoKeys){
    try{
      const res = await window.storage.get(key);
      if(res) photoCache['__form__'+key] = res.value;
    }catch(e){}
  }
  renderPhotoStrip();
  document.getElementById('save-btn').textContent = '수정 완료';
  switchTab('add');
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteItem(id){
  const item = items.find(i=>i.id===id);
  items = items.filter(i=>i.id!==id);
  try{
    await saveItems();
    if(item && item.photoKeys){
      for(const key of item.photoKeys){
        try{ await window.storage.delete(key, false); }catch(e){}
      }
    }
    showToast('삭제되었습니다');
    renderList();
    updateVenueList();
  }catch(e){
    showToast('삭제 실패');
  }
}

function resetFilters(){
  filterVenues = []; filterTeams = []; filterTypes = [];
  expandedSection = null;
  document.getElementById('search').value = '';
  renderList();
}

function toggleSection(name){
  expandedSection = (expandedSection===name) ? null : name;
  renderChips();
}

function renderChips(){
  const venueCat = document.getElementById('venue-cat');
  const venueSel = document.getElementById('venue-selected');
  const venueChipWrap = document.getElementById('venue-chips');
  const venueCaret = document.getElementById('venue-caret');
  const venues = [...new Set(items.map(i=>i.venue))].sort();
  venueSel.textContent = filterVenues.length>0 ? filterVenues.join(', ') : '';
  const venueOpen = expandedSection==='venue';
  venueCat.classList.toggle('open', venueOpen);
  venueCaret.textContent = venueOpen ? '▴' : '▾';
  venueChipWrap.style.display = venueOpen ? '' : 'none';
  venueChipWrap.innerHTML = `<div class="chip ${filterVenues.length===0?'active':''}" onclick="clearCategory('venue')">전체</div>` +
    venues.map(v=>
      `<div class="chip ${filterVenues.includes(v)?'active':''}" onclick="toggleVenue('${v.replace(/'/g,"\\'")}')">${escapeHtml(v)}</div>`
    ).join('');

  const teamBlock = document.getElementById('team-block');
  const teamCat = document.getElementById('team-cat');
  const teamSel = document.getElementById('team-selected');
  const teamChipWrap = document.getElementById('team-chips');
  const teamCaret = document.getElementById('team-caret');
  let teams = [];
  if(filterVenues.length>0){
    teams = [...new Set(items.filter(i=>filterVenues.includes(i.venue)).map(i=>i.team).filter(Boolean))].sort();
  }
  filterTeams = filterTeams.filter(t=>teams.includes(t));
  if(filterVenues.length>0 && teams.length>0){
    teamBlock.style.display = '';
    teamSel.textContent = filterTeams.length>0 ? filterTeams.join(', ') : '';
    const teamOpen = expandedSection==='team';
    teamCat.classList.toggle('open', teamOpen);
    teamCaret.textContent = teamOpen ? '▴' : '▾';
    teamChipWrap.style.display = teamOpen ? '' : 'none';
    teamChipWrap.innerHTML = `<div class="chip ${filterTeams.length===0?'active':''}" onclick="clearCategory('team')">전체</div>` +
      teams.map(t=>
        `<div class="chip ${filterTeams.includes(t)?'active':''}" onclick="toggleTeam('${t.replace(/'/g,"\\'")}')">${escapeHtml(t)}</div>`
      ).join('');
  }else{
    teamBlock.style.display = 'none';
  }

  const typeCat = document.getElementById('type-cat');
  const typeSel = document.getElementById('type-selected');
  const typeChipWrap = document.getElementById('type-chips');
  const typeCaret = document.getElementById('type-caret');
  const scoped = items.filter(i=>{
    if(filterVenues.length>0 && !filterVenues.includes(i.venue)) return false;
    if(filterTeams.length>0 && !filterTeams.includes(i.team)) return false;
    return true;
  });
  const types = [...new Set(scoped.map(i=>i.type))].sort();
  filterTypes = filterTypes.filter(t=>types.includes(t));
  typeSel.textContent = filterTypes.length>0 ? filterTypes.join(', ') : '';
  const typeOpen = expandedSection==='type';
  typeCat.classList.toggle('open', typeOpen);
  typeCaret.textContent = typeOpen ? '▴' : '▾';
  typeChipWrap.style.display = typeOpen ? '' : 'none';
  typeChipWrap.innerHTML = `<div class="chip ${filterTypes.length===0?'active':''}" onclick="clearCategory('type')">전체</div>` +
    types.map(t=>
      `<div class="chip ${filterTypes.includes(t)?'active':''}" onclick="toggleType('${t.replace(/'/g,"\\'")}')">${escapeHtml(t)}</div>`
    ).join('');
}

function toggleVenue(v){
  const idx = filterVenues.indexOf(v);
  if(idx>-1) filterVenues.splice(idx,1); else filterVenues.push(v);
  renderList();
}
function toggleTeam(t){
  const idx = filterTeams.indexOf(t);
  if(idx>-1) filterTeams.splice(idx,1); else filterTeams.push(t);
  renderList();
}
function toggleType(t){
  const idx = filterTypes.indexOf(t);
  if(idx>-1) filterTypes.splice(idx,1); else filterTypes.push(t);
  renderList();
}
function clearCategory(name){
  if(name==='venue'){ filterVenues=[]; filterTeams=[]; }
  if(name==='team'){ filterTeams=[]; }
  if(name==='type'){ filterTypes=[]; }
  renderList();
}

let lightboxPhotos = [];
let lightboxIndex = 0;

function openLightbox(itemId, startIndex){
  lightboxPhotos = photoCache[itemId] || [];
  if(lightboxPhotos.length===0) return;
  lightboxIndex = startIndex;
  const img = document.getElementById('lightbox-img');
  img.style.opacity = '';
  img.style.transform = '';
  document.getElementById('lightbox').classList.add('show');
  const multi = lightboxPhotos.length>1;
  document.getElementById('lightbox-prev').style.display = multi ? '' : 'none';
  document.getElementById('lightbox-next').style.display = multi ? '' : 'none';
  document.getElementById('lightbox-count').style.display = multi ? '' : 'none';
  updateLightboxDOM();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}
function lightboxPrev(){
  lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
  updateLightboxDOM(true);
}
function lightboxNext(){
  lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
  updateLightboxDOM(true);
}
function updateLightboxDOM(crossfade){
  const img = document.getElementById('lightbox-img');
  const counter = document.getElementById('lightbox-count');
  if(crossfade){
    img.style.opacity = 0;
    img.style.transform = 'scale(0.97)';
    setTimeout(()=>{
      img.src = lightboxPhotos[lightboxIndex];
      counter.textContent = (lightboxIndex+1)+' / '+lightboxPhotos.length;
      img.style.opacity = 1;
      img.style.transform = 'scale(1)';
    }, 160);
  }else{
    img.src = lightboxPhotos[lightboxIndex];
    counter.textContent = (lightboxIndex+1)+' / '+lightboxPhotos.length;
  }
}
document.getElementById('lightbox').addEventListener('click', (e)=>{
  if(e.target.id==='lightbox') closeLightbox();
});
document.addEventListener('keydown', (e)=>{
  if(!document.getElementById('lightbox').classList.contains('show')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lightboxPrev();
  if(e.key==='ArrowRight') lightboxNext();
});

function renderList(){
  renderChips();
  const q = document.getElementById('search').value.trim().toLowerCase();
  const qTokens = q ? q.split(/\s+/).filter(Boolean) : [];
  const filtered = items.filter(i=>{
    if(filterVenues.length>0 && !filterVenues.includes(i.venue)) return false;
    if(filterTeams.length>0 && !filterTeams.includes(i.team)) return false;
    if(filterTypes.length>0 && !filterTypes.includes(i.type)) return false;
    if(qTokens.length===0) return true;
    const hay = [i.venue,i.team,i.location,i.name,i.tag,i.model,i.ip,i.mac,i.serial,i.uplink,i.type,i.note].join(' ').toLowerCase();
    return qTokens.every(tok=>hay.includes(tok));
  });

  const venueCount = new Set(items.map(i=>i.venue)).size;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${items.length}</div><div class="l">전체 장비</div></div>
    <div class="stat"><div class="n">${venueCount}</div><div class="l">업장 수</div></div>
    <div class="stat"><div class="n">${filtered.length}</div><div class="l">검색 결과</div></div>
  `;

  const body = document.getElementById('list-body');
  if(filtered.length===0){
    body.innerHTML = `<div class="empty"><div class="big">🗂️</div>${items.length===0 ? '등록된 장비가 없습니다.<br>등록 탭에서 장비를 추가하세요.' : '조건에 맞는 장비가 없습니다.'}</div>`;
    return;
  }

  const byVenue = {};
  filtered.forEach(i=>{
    if(!byVenue[i.venue]) byVenue[i.venue] = [];
    byVenue[i.venue].push(i);
  });

  let html = '';
  let staggerIdx = 0;
  Object.keys(byVenue).sort().forEach(venue=>{
    html += `<div class="venue-group"><div class="venue-title" style="animation-delay:${Math.min(staggerIdx*20,240)}ms">${escapeHtml(venue)} (${byVenue[venue].length})</div>`;
    byVenue[venue].forEach(item=>{
      staggerIdx++;
      const itemDelay = Math.min(staggerIdx*20,260);
      const hasPhotos = item.photoKeys && item.photoKeys.length>0;
      html += `
        <div class="item" style="animation-delay:${itemDelay}ms">          <div class="item-top">
            <div style="flex:1;min-width:0;">
              <span class="item-name">${escapeHtml(item.name)}</span>
              <span class="badge type">${escapeHtml(item.type)}</span>
              ${item.team ? `<span class="badge">${escapeHtml(item.team)}</span>` : ''}
              ${item.tag ? `<span class="badge">${escapeHtml(item.tag)}</span>` : ''}
              ${item.mode ? `<span class="badge">${escapeHtml(item.mode)}</span>` : ''}
              <div class="item-loc">${escapeHtml(item.location)}</div>
            </div>
            <div class="item-actions">
              <div class="icon-btn" onclick="startEdit('${item.id}')" title="수정">✎</div>
              <div class="icon-btn" onclick="if(confirm('삭제하시겠습니까?')) deleteItem('${item.id}')" title="삭제">✕</div>
            </div>
          </div>
          ${(item.model || item.ip || item.mac || item.serial || item.uplink || item.note) ? `<div class="item-meta">
            ${item.model ? `모델: ${escapeHtml(item.model)}<br>` : ''}
            ${item.ip ? `${escapeHtml(item.iptype || 'IP')}: ${escapeHtml(item.ip)}<br>` : ''}
            ${item.mac ? `MAC: ${escapeHtml(item.mac)}<br>` : ''}
            ${item.serial ? `시리얼: ${escapeHtml(item.serial)}<br>` : ''}
            ${item.uplink ? `연결 스위치: ${escapeHtml(item.uplink)}<br>` : ''}
            ${item.note ? escapeHtml(item.note) : ''}
          </div>` : ''}
          ${hasPhotos ? `<div class="photo-thumb-row" id="thumbs-${item.id}"></div>` : ''}
        </div>`;
    });
    html += `</div>`;
  });
  body.innerHTML = html;

  filtered.filter(i=>i.photoKeys && i.photoKeys.length>0).forEach(item=>{
    Promise.all(item.photoKeys.map(key=>window.storage.get(key).then(r=>r?r.value:null).catch(()=>null)))
      .then(results=>{
        const photos = results.filter(Boolean);
        photoCache[item.id] = photos;
        const wrap = document.getElementById('thumbs-'+item.id);
        if(wrap){
          wrap.innerHTML = photos.map((url,idx)=>
            `<img src="${url}" onclick="openLightbox('${item.id}',${idx})">`
          ).join('');
        }
      });
  });
}

document.getElementById('search').addEventListener('input', renderList);


async function clearAllData(){
  if(!confirm('전체 장비 데이터를 삭제할까요? (사진도 함께 삭제됩니다)')) return;
  for(const it of items){
    if(it.photoKeys){
      for(const key of it.photoKeys){
        try{ await window.storage.delete(key, false); }catch(e){}
      }
    }
  }
  items = [];
  try{
    await saveItems();
    updateVenueList();
    filterVenues = []; filterTeams = []; filterTypes = [];
    renderList();
    showToast('전체 삭제됨');
  }catch(e){
    showToast('삭제 실패');
  }
}

(async function init(){
  await loadItems();
  updateVenueList();
  updateIpLabel();
  updateModeVisibility();
  renderList();
})();
</script>
